version: '3.8'

services:
  # Pramiti AI Application
  pramiti-ai:
    build: .
    container_name: pramiti-ai
    ports:
      - "8084:8084"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HOST=0.0.0.0
      - PORT=8084
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CHROMA_PERSIST_DIRECTORY=/app/data/rag/chroma
      - CONVERSATIONS_DIR=/app/data/rag/conversations
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./secrets:/app/secrets
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - pramiti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pramiti-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - pramiti-network
    depends_on:
      - pramiti-ai

  # PostgreSQL Database (Optional - currently not used)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: pramiti-postgres
  #   environment:
  #     - POSTGRES_DB=pramiti_ai
  #     - POSTGRES_USER=pramiti_user
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped
  #   networks:
  #     - pramiti-network

  # Redis Cache (Optional - currently not used)
  # redis:
  #   image: redis:7-alpine
  #   container_name: pramiti-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped
  #   networks:
  #     - pramiti-network
  #   command: redis-server --appendonly yes

volumes:
  postgres-data:
  redis-data:
  nginx-logs:

networks:
  pramiti-network:
    driver: bridge
